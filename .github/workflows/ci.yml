name: CI

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Auction-Project)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Auction-Project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Auction-Project/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (Auction-Server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Auction-Server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Auction-Server/package-lock.json
      - run: npm ci
      - run: npm test -- --passWithNoTests
